name: "Check PHP Code Style"

on:
  push:
    branches: [master]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'pint.json'
      - '.github/workflows/pint-check.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'pint.json'
      - '.github/workflows/pint-check.yml'

permissions:
  contents: read

jobs:
  pint:
    name: Pint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          show-progress: 'false'
          fetch-depth: '1'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist
      - name: Check PHP code style
        run: composer test:lint
